version: 2

models:
  - name: stg_uniswap_swaps
    description: "Staged Uniswap swap events with timestamp conversion."
    columns:
      - name: tx_hash
        description: "Transaction hash"
        data_tests:
          - not_null
      - name: block_timestamp
        description: "Timestamp with timezone of the block"
        data_tests:
          - not_null
