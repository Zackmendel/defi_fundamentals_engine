name: defi_fundamentals_engine

profile: defi_fundamentals_engine

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  defi_fundamentals_engine:
    +schema: raw

models:
  defi_fundamentals_engine:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    01_staging:
      +materialized: view
      +schema: staging
    02_intermediate:
      +materialized: view
      +schema: intermediate
    03_marts:
      +materialized: table
      +schema: mart
    04_metrics:
      +materialized: table 
      +schema: metrics
flags:
  require_generic_test_arguments_property: true